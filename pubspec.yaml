name: shellbox
description: SSH client with hosts, keychain, snippets, multi-tab terminal and SFTP.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  dartssh2: ^4.1.0
  xterm: ^4.0.0
  cryptography: ^2.9.0
  crypto: ^3.0.6
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  google_fonts: ^8.2.1
  wireguard_flutter: ^0.1.3
  firebase_core: ^4.15.0
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0
  hugeicons: ^0.0.11
  local_auth: ^3.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icon_full.png
  min_sdk_android: 24
  remove_alpha_ios: true
  background_color_ios: "#0D1117"
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: assets/images/icon_fg.png
  windows:
    generate: true
    image_path: assets/images/icon_full.png
  macos:
    generate: true
    image_path: assets/images/icon_full.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
